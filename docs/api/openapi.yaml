components:
  schemas:
    User:
      required:
        - email
        - password
        - role
        - username
      type: object
      properties:
        username:
          maxLength: 255
          minLength: 1
          type: string
        password:
          maxLength: 255
          minLength: 1
          type: string
        email:
          maxLength: 255
          minLength: 1
          type: string
        avatar:
          maxLength: 255
          minLength: 0
          type: string
        role:
          maxLength: 5
          minLength: 1
          type: string
        id:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
    Workspace:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
        id:
          type: integer
          format: int32
        ownerId:
          $ref: '#/components/schemas/User'
    ResUserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        role:
          type: string
        createdDate:
          type: string
          format: date-time
    ResWorkspaceDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        owner:
          $ref: '#/components/schemas/ResUserDTO'
        boardCount:
          type: integer
          format: int32
        memberCount:
          type: integer
          format: int32
    RestResponseResWorkspaceDTO:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: object
        data:
          $ref: '#/components/schemas/ResWorkspaceDTO'
    Board:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
        id:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
        isPublic:
          type: boolean
        workspaceId:
          $ref: '#/components/schemas/Workspace'
    Boardlist:
      required:
        - name
        - status
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          maxLength: 255
          minLength: 1
          type: string
        position:
          type: integer
          format: int32
        status:
          maxLength: 11
          minLength: 1
          type: string
        boardId:
          $ref: '#/components/schemas/Board'
    Card:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
        description:
          type: string
        userId:
          $ref: '#/components/schemas/User'
        id:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
        isActive:
          type: boolean
        dueDate:
          type: string
          format: date-time
        reminderDate:
          type: string
          format: date-time
        position:
          type: integer
          format: int32
        listId:
          $ref: '#/components/schemas/Boardlist'
    ResAttachmentDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        filename:
          type: string
        url:
          type: string
        updateDate:
          type: string
          format: date-time
    ReqRegisterDTO:
      required:
        - email
        - password
        - username
      type: object
      properties:
        username:
          type: string
        password:
          maxLength: 2147483647
          minLength: 6
          type: string
        email:
          type: string
    ResRegisterDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        username:
          type: string
        role:
          type: string
    RestResponseResRegisterDTO:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: object
        data:
          $ref: '#/components/schemas/ResRegisterDTO'
    RestResponseMapStringString:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: object
        data:
          type: object
          additionalProperties:
            type: string
    ReqLoginDTO:
      required:
        - password
        - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    ResLoginDTO:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        userId:
          type: integer
          format: int32
        username:
          type: string
        role:
          type: string
    RestResponseResLoginDTO:
