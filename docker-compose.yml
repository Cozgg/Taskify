services:
  db:
    image: mysql:8.4
    container_name: taskify-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskifydb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend/Taskify
      dockerfile: Dockerfile
    container_name: taskify-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: "-Dhibernate.connection.url=jdbc:mysql://db:3306/taskifydb -Dhibernate.connection.username=root -Dhibernate.connection.password=root -Dhibernate.hbm2ddl.auto=update"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend/taskify
      dockerfile: Dockerfile
    container_name: taskify-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskify-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data: