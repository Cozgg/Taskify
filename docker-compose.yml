services:
  db:
    image: cozg/taskify-db:v1
    container_name: taskify-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: cozg/taskify-backend:v1
    container_name: taskify-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CATALINA_OPTS: "-Dhibernate.connection.url=jdbc:mysql://db:3306/taskifydb -Dhibernate.connection.username=root -Dhibernate.connection.password=${DB_PASSWORD} -Drabbitmq.host=rabbitmq -Dhibernate.hbm2ddl.auto=none"
    depends_on:
      - db
      - rabbitmq

  frontend:
    image: cozg/taskify-frontend:v1
    container_name: taskify-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskify-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
