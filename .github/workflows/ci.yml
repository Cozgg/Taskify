name: Taskify CI/CD

on:
  push:
    branches: ["main", "develop", "cozg"]
  pull_request:
    branches: ["main", "develop", "cozg"]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Build with Maven
        working-directory: ./backend/Taskify
        run: mvn clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/taskify/package-lock.json
      - name: Install & Build
        working-directory: ./frontend/taskify
        run: |
          npm install
          CI=false npm run build

  #CI
  docker-check:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image (Check)
        run: docker build ./backend/Taskify -t taskify-backend:test
      - name: Build Frontend Image (Check)
        run: docker build ./frontend/taskify -t taskify-frontend:test

  #CD
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cozg')
    needs: docker-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Backend
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/taskify-backend
          # Chuyển đổi IMAGE_ID thành chữ thường
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build ./backend/Taskify -t $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

      - name: Build and Push Frontend
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/taskify-frontend
          # Chuyển đổi IMAGE_ID thành chữ thường
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build ./frontend/taskify -t $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
